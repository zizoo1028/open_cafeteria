<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나눔 식권 · 열린식당</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tw-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" class="sticky top-0 z-[1100]"></header>
  <main>
    <section class="bg-gradient-to-b from-green-50 to-cream">
      <div class="max-w-5xl mx-auto px-4 pt-10 pb-8">
        <h1 class="text-3xl md:text-4xl font-extrabold">🤝 나눔 식권</h1>
        <p class="mt-2 text-lg text-stone-600">이웃이 기부한 식권으로 어르신·청소년이 동네 구내식당에서 따뜻한 한 끼를 먹어요.</p>
        <dl id="stats" class="mt-6 grid grid-cols-3 gap-3"></dl>
      </div>
    </section>
    <div class="max-w-5xl mx-auto px-4 py-8">
      <div class="flex gap-2 overflow-x-auto scrollbar-none" role="tablist">
        <button class="chip" data-tab="give" role="tab">💚 기부하기</button>
        <button class="chip" data-tab="get" role="tab">🍚 식권 받기</button>
        <button class="chip" data-tab="status" role="tab">📋 나눔 현황</button>
      </div>
      <div id="content" class="mt-6"></div>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/share.js"></script>
</body>
</html>
