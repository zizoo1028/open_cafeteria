<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>후기 피드 · 열린식당</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tw-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" class="sticky top-0 z-[1100]"></header>
  <main class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-extrabold">💬 후기 피드</h1>
    <p id="summary" class="mt-1 text-stone-500"></p>
    <div class="mt-6 flex flex-col sm:flex-row gap-2">
      <select id="filter" class="input sm:max-w-xs" aria-label="식당 선택"></select>
      <div class="flex gap-2">
        <button class="chip on" data-sort="new">최신순</button>
        <button class="chip" data-sort="high">별점 높은순</button>
        <button class="chip" data-sort="low">별점 낮은순</button>
      </div>
    </div>
    <div id="list" class="mt-6 space-y-3"></div>
  </main>
  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>
